name: Registry sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dsh-plugin-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Registry
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_GITHUB_TOKEN || github.token }}
          REGISTRY_SYNC_MANIFEST: /tmp/dsh-registry-changes.json
        run: |
          set -o pipefail
          pnpm --filter dsh-plugin-registry sync 2>&1 | tee /tmp/dsh-registry-summary.txt
      - name: Publish job summary
        if: always()
        run: test ! -f /tmp/dsh-registry-summary.txt || cat /tmp/dsh-registry-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit changed Registry
        run: |
          git add dsh-plugin-registry/registry/v1
          if git diff --cached --quiet -- dsh-plugin-registry/registry/v1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(registry): publish changed plugin facts"
          git push

  publish:
    needs: sync
    uses: ./.github/workflows/registry-publish.yml
