name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dsh-plugin-registry typecheck
      - run: pnpm --filter dsh-plugin-registry test
      - run: pnpm --filter dsh-plugin-registry build
      - run: pnpm --filter dsh-plugin-registry generate:schemas
      - run: git diff --exit-code -- dsh-plugin-registry/schemas
      - run: pnpm --filter untr-dsh-marketplace typecheck
      - run: pnpm --filter untr-dsh-marketplace test
      - run: pnpm --filter untr-dsh-marketplace build
      - name: Verify Marketplace package
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-marketplace-pack"
          pnpm --filter untr-dsh-marketplace pack --pack-destination "$RUNNER_TEMP/dsh-marketplace-pack"
          tarball=$(find "$RUNNER_TEMP/dsh-marketplace-pack" -maxdepth 1 -name '*.tgz' -print -quit)
          node --import tsx dsh-marketplace/scripts/verify-pack.ts "$tarball"
