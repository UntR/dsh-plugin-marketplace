name: Registry publish

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-data/**'
      - 'native-data/**'
      - 'dsh-plugin-registry/**'
      - '.github/workflows/registry-publish.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsh-registry-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate approved AI records and assemble complete Registry
        run: pnpm --filter dsh-plugin-registry publish:registry
      - name: Build native Client source and complete catalog
        run: |
          node --import tsx dsh-plugin-registry/src/native-cli.ts publish/registry/v1 native-data/v1/proofs auto publish/native/format1
          python3 tools/ai-catalog/publish-status.py
      - name: Produce offline enrichment plan
        run: python3 tools/ai-catalog/cli.py plan --dry-run --limit 30000 > publish/ai-plan.json
      - name: Refuse a superseded build
        run: |
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD)" = "$remote"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish one consistent snapshot
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
