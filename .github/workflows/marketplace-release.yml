name: Marketplace release

on:
  workflow_dispatch:
  push:
    tags:
      - "dsh-marketplace-v*"

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter untr-dsh-marketplace typecheck
      - run: pnpm --filter untr-dsh-marketplace test
      - run: pnpm --filter untr-dsh-marketplace build
      - name: Pack and verify
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-marketplace-pack"
          pnpm --filter untr-dsh-marketplace pack --pack-destination "$RUNNER_TEMP/dsh-marketplace-pack"
          tarball=$(find "$RUNNER_TEMP/dsh-marketplace-pack" -maxdepth 1 -name '*.tgz' -print -quit)
          node --import tsx dsh-marketplace/scripts/verify-pack.ts "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-marketplace-package
          path: ${{ env.tarball }}
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/dsh-marketplace-v')
        run: npm publish "$tarball" --access public --provenance
